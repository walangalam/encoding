name: Build Alyx G2 Voice

on:
  push:
    branches:
      - build/alyx-g2-voice-0.1.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alyx-g2-voice/package.json
      - name: Install dependencies
        working-directory: alyx-g2-voice
        run: npm install
      - name: Build and pack
        working-directory: alyx-g2-voice
        run: npm run pack
      - name: Verify package
        working-directory: alyx-g2-voice
        run: |
          test -s AlyxG2Voice-0.1.1.ehpk
          head -c 4 AlyxG2Voice-0.1.1.ehpk | grep -q EHPK
          sha256sum AlyxG2Voice-0.1.1.ehpk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlyxG2Voice-0.1.1
          path: alyx-g2-voice/AlyxG2Voice-0.1.1.ehpk
          if-no-files-found: error
